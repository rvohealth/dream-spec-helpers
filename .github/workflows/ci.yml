name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    # for specs that need a database (cleanTestDb)
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: dream_spec_helpers
          POSTGRES_DB: dream_spec_helpers_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DB_USER: dream_spec_helpers
      DB_NAME: dream_spec_helpers_test
      DB_HOST: localhost
      DB_PASSWORD: postgres
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # the build type-checks src/ only; this also checks spec/
      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Specs
        run: pnpm spec

      - name: Check Node 24 runtime APIs and declarations
        if: matrix.node-version == 24
        run: |
          node --input-type=module -e "import('./dist/esm/src/index.js')"
          test -f dist/types/src/index.d.ts
